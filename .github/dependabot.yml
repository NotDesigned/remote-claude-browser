version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # The rrweb family moves together, by hand: record and replay are patched in patches/ for an
    # exact version (package.json pnpm.patchedDependencies), and check:rrweb fails unless every
    # rrweb package is on that one version. A Dependabot update of any of them cannot pass.
    ignore:
      - dependency-name: "@rrweb/*"
      - dependency-name: "rrweb*"
  # Base images in the Dockerfiles, pinned by tag and digest.
  - package-ecosystem: docker
    directories: [/deploy, /client]
    schedule:
      interval: weekly
  # Images named in the Compose files (Caddy).
  - package-ecosystem: docker-compose
    directories: [/, /client]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
