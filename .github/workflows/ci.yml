name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly: also runs the host-network variants, which pull requests skip.
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

# Per event as well as per ref: the nightly run and a push to main share the ref but must not
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the documentation
        run: pnpm run docs:check
      - run: pnpm run format:check
      - run: pnpm run check:rrweb
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Test packages and deployment helpers
        run: pnpm run test

  # High-severity advisories in production dependencies. A separate job, so a newly published
  # advisory shows on its own instead of hiding the other results.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:prod

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Test navigation and the back-forward cache
        run: pnpm run test:browser-lifecycle
      - name: Test that pages cannot see the recorder
        run: pnpm run test:stealth
      - name: Test cross-site frame assumptions
        run: pnpm run probe:oopif
      - name: Test that nested frames send their documents once
        run: node packages/agent/test/frames.acceptance.mjs
      - name: Test picture mode, touch input and a ProseMirror composer
        run: |
          pnpm run test:pixel-ui
          pnpm run test:mobile-input
          MIRROR_LIVE_TREE_VERIFY=1 pnpm run test:composer-input
          SMOKE_RTT_MS=300 SMOKE_JITTER_MS=50 SMOKE_STALL_RATE=0.02 pnpm run test:composer-input
          SMOKE_RTT_MS=300 SMOKE_JITTER_MS=50 COMPOSER_SMOKE_ONLY=rounds pnpm run test:composer-input
          MIRROR_INPUT_ACKS=off pnpm run test:composer-input
          MIRROR_LIVE_TREE=0 pnpm run test:composer-input
      - name: Test single-writer input over a lossy link (desktop and phone)
        run: |
          SMOKE_INPUT=proxy SMOKE_RTT_MS=150 SMOKE_LOSS_RATE=0.02 pnpm run test:composer-input
          SMOKE_INPUT=proxy SMOKE_RTT_MS=150 SMOKE_LOSS_RATE=0.02 SMOKE_DEVICE=desktop COMPOSER_SMOKE_ONLY=gate SMOKE_GATE_OUT=gate-desktop.json pnpm run test:composer-input
          SMOKE_INPUT=proxy SMOKE_RTT_MS=150 SMOKE_LOSS_RATE=0.02 SMOKE_DEVICE=pixel COMPOSER_SMOKE_ONLY=gate SMOKE_GATE_OUT=gate-pixel.json pnpm run test:composer-input
      - name: Test video and sound over WebRTC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          xvfb-run --auto-servernum pnpm run test:rtc-media

  # The gateway's live tree against real Chromium: scripted changes on a long conversation and
  # seeded fuzz, each checkpoint compared with the page's own snapshot and with a replay of the
  # stream. Then the bench, for its numbers only.
  live-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: quality
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Test the live tree against Chromium (20 seeds of 2000 operations)
        run: pnpm run test:live-tree-accept
      - name: Measure the live tree (informational)
        continue-on-error: true
        run: BENCH_STREAM_MS=20000 BENCH_FAST_TOKENS=5000 pnpm run bench:live-tree

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: quality
    env:
      CHROME_PATH: /usr/bin/google-chrome
      # The CPA images the Compose smoke builds. Named here, it keeps them for the CPA smokes
      # below; its own project-scoped default tags are removed when it ends.
      CPA_BROKER_IMAGE: remote-claude-browser-cpa-broker:ci
      CPA_BROKER_ENGINE_IMAGE: remote-claude-browser-cpa:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check every Compose combination the documentation lists
        run: pnpm run check:compose
      - name: Validate deployer-managed Caddy ingress examples
        run: node --test examples/caddy/ingress.test.mjs
      - name: Load the server's AppArmor profile, as deployers do
        run: |
          sudo bash scripts/install-apparmor.sh
          sudo grep -x 'remote-claude-browser (enforce)' /sys/kernel/security/apparmor/profiles
          # The host keeps Ubuntu's restriction on unprivileged user namespaces.
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          sudo bash scripts/check-host.sh
      - name: Build the tunnel image
        run: docker build client
      - name: Build the deployment's images and test them with the real Compose files
        run: pnpm smoke:compose
      - name: Test proxy, CPA and user management on desktop and phone
        run: |
          pnpm --filter @mirror/viewer... run build
          pnpm test:network-ui
          pnpm test:users-ui
      - name: Test the browser filesystem boundary
        run: pnpm smoke:browser-filesystem
        env:
          SERVER_IMAGE: remote-claude-browser-server:local
      - name: Test per-profile Mihomo networking, private CDP and stock CPA
        run: |
          fixture=$(docker create remote-claude-browser-server:local)
          docker cp "$fixture:/usr/local/bin/mihomo" "$RUNNER_TEMP/mihomo"
          docker rm -v "$fixture"
          PROFILE_EGRESS_MIHOMO="$RUNNER_TEMP/mihomo" pnpm smoke:profile-egress
          pnpm smoke:cpa-tenancy
        env:
          PROFILE_EGRESS_SMOKE_IMAGE: remote-claude-browser-server:local
          PROFILE_EGRESS_STOCK_CPA: "1"
      - name: Validate proxy settings with the packaged Xray binary
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint node \
            -e XRAY_PATH=/usr/local/bin/xray -v "$PWD/deploy:/checks:ro" \
            remote-claude-browser-server:local --test /checks/egress-proxy.test.mjs
      - name: Test Xray TUN, interface-bound UDP, outage blocking and restart
        run: bash scripts/proxy-smoke.sh
      # The host-network variants take the longest; pull requests skip them.
      - name: Test it on the host's network, with video and sound
        if: github.event_name != 'pull_request'
        run: pnpm smoke:compose
        env:
          SMOKE_HOSTNET: "1"
          SMOKE_VIDEO: "1"
          SMOKE_CANVAS: "1"
          MIRROR_CANVAS_SITES: "*"
      - name: Test Xray routing and cleanup on the host network
        if: github.event_name != 'pull_request'
        run: bash scripts/proxy-smoke.sh
        env:
          PROXY_SMOKE_HOSTNET: "1"
