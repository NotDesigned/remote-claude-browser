name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:rrweb
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the Compose files
        run: |
          export MIRROR_ACCESS_PASSWORD=x MIRROR_ACCESS_SECRET=x MIRROR_AUTH_SECRET=x PUBLIC_HOST=example.com
          docker compose -f compose.yml -f compose.https.yml config --quiet
          SERVER_SSH_HOST=example.com docker compose -f client/compose.yml config --quiet
      - name: Build the tunnel image
        run: docker build client
      - name: Build and test the server image
        run: pnpm smoke:compose
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Test it on the host's network, with video and sound
        run: pnpm smoke:compose
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SMOKE_HOSTNET: "1"
          SMOKE_VIDEO: "1"
          SMOKE_CANVAS: "1"
          MIRROR_CANVAS_SITES: "*"
