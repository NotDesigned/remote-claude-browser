name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:rrweb
      - run: pnpm run build
      - run: pnpm run typecheck
      - name: Test packages and deployment helpers
        run: pnpm run test

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the Compose files
        run: |
          export MIRROR_ACCESS_PASSWORD=x MIRROR_ACCESS_SECRET=x MIRROR_AUTH_SECRET=x PUBLIC_HOST=example.com
          docker compose -f compose.yml -f compose.https.yml config --quiet
          EGRESS_PROXY=socks5://127.0.0.1:1080 docker compose -f compose.yml -f compose.hostnet.yml \
            -f compose.proxy.yml config --quiet
          SERVER_SSH_HOST=example.com docker compose -f client/compose.yml config --quiet
      - name: Build the tunnel image
        run: docker build client
      - name: Build and test the server image
        run: pnpm smoke:compose
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Test it on the host's network, with video and sound
        run: pnpm smoke:compose
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SMOKE_HOSTNET: "1"
          SMOKE_VIDEO: "1"
          SMOKE_CANVAS: "1"
          MIRROR_CANVAS_SITES: "*"

      - name: Validate proxy settings with the packaged Xray binary
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint node \
            -e XRAY_PATH=/usr/local/bin/xray -v "$PWD/deploy:/checks:ro" \
            remote-claude-browser-server:local --test /checks/egress-proxy.test.mjs
      - name: Test Xray TUN, interface-bound UDP, outage blocking and restart
        run: bash scripts/proxy-smoke.sh
      - name: Test Xray routing and cleanup on the host network
        run: bash scripts/proxy-smoke.sh
        env:
          PROXY_SMOKE_HOSTNET: "1"
