name: Images

# Publishes the prebuilt images deployers pull: after CI passes on main (the commit CI tested), and
# for version tags whose commit CI has passed on. Each image gets a signed build provenance.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

# Runs for main publish one at a time, in the order they started, so an older commit's run cannot
# finish after a newer one and move latest back; a queued one gives way to a newer one, and none is
# cancelled while it pushes. Each version tag has its own group and never sets latest.
concurrency:
  group: images-${{ github.event_name == 'push' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short: ${{ steps.commit.outputs.short }}
      latest: ${{ steps.commit.outputs.latest }}
    steps:
      - id: commit
        name: Pick the commit and require a passing CI run on it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest=false
          if [[ $GITHUB_EVENT_NAME == workflow_run ]]; then
            sha=$RUN_SHA
            # latest follows main: a run whose commit main has already moved past publishes only
            # its sha- tag.
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [[ $head == "$sha" ]]; then latest=true; fi
          else
            sha=$GITHUB_SHA
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.total_count')
            if [[ $passed == 0 ]]; then
              echo "::error::CI has not passed on $sha. Run CI on this commit (or push it to main), then push the tag again."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            file: deploy/Dockerfile.server
            target: ""
          - name: cpa-broker
            context: .
            file: deploy/Dockerfile.cpa-broker
            target: ""
          - name: cpa
            context: .
            file: deploy/Dockerfile.cpa
            target: cpa
          - name: tunnel
            context: client
            file: client/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remote-claude-browser-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # Only the line below sets latest; without this a version tag would move it as well.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.gate.outputs.latest == 'true' }}
            type=raw,value=sha-${{ needs.gate.outputs.short }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
