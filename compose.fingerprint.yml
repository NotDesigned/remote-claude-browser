# Optional local fingerprint engine. Download the pinned release with scripts/setup-fingerprint.sh.
# Only new profiles use AliasMode: Windows persona with the isolated broker, Linux for direct launches.
# Existing profiles retain their saved engine and platform.
services:
  server:
    environment:
      MIRROR_BROWSER_ENGINE: ${MIRROR_BROWSER_ENGINE:-aliasmode}
    volumes:
      - ${FINGERPRINT_BROWSER_DIR:?Set FINGERPRINT_BROWSER_DIR to the installed AliasMode directory}:/usr/local/lib/aliasmode:ro
      # The Windows and macOS fonts AliasMode personas show (scripts/fingerprint-fonts.sh).
      - ${FINGERPRINT_FONTS_DIR:-./local/fingerprint-fonts}:/usr/local/share/fonts/fingerprint:ro
