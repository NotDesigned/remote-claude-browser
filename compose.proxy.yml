# Optional: send everything the browser opens, its DNS lookups and WebRTC included, through one
# outside proxy. Set EGRESS_PROXY in .env to the proxy's share link (socks5://, http://, https://,
# ss://, vless://, vmess://, trojan://, hy2://) or to an Xray outbound in JSON, then add this file:
#   docker compose -f compose.yml [-f compose.hostnet.yml] -f compose.proxy.yml up -d
# If the proxy is down, pages get no connection rather than one from this host's address.
services:
  server:
    environment:
      EGRESS_PROXY: ${EGRESS_PROXY:?Set EGRESS_PROXY in .env to use compose.proxy.yml}
      # Looks up the proxy's own name, which cannot go through the proxy.
      EGRESS_BOOTSTRAP_DNS: ${EGRESS_BOOTSTRAP_DNS:-}
    devices:
      - /dev/net/tun:/dev/net/tun
    # Xray answers DNS here, using DoH through the proxy.
    dns:
      - 198.18.0.2
