# Per-profile Mihomo exits and one stock CPA instance per workbench user: the standard deployment.
# Ingress remains deployer-managed. See docs/deployment.md.
services:
  server:
    environment:
      MIRROR_PROFILE_EGRESS: "1"
      MIRROR_RUNTIME_SOCKET: /run/remote-browser/runtime.sock
      CPA_BROKER_SOCKET: /run/cpa/cpa.sock
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /run/netns:rw,nosuid,nodev,size=1m,mode=0755
      - /run/remote-browser:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - cpa-control:/run/cpa:ro
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    networks:
      browser: {}
      cpa-runtime:
        # Only for CPA instances created before per-instance networks, which still sit on this
        # network until cpa-broker replaces them (it does so when it starts, see reconcile in
        # deploy/cpa-broker.mjs). Remove the alias once every deployment has run a release with
        # per-instance networks: then no instance reaches the server by this name.
        aliases: [runtime-egress]
    depends_on:
      cpa-broker:
        condition: service_healthy

  cpa-engine-image:
    image: ${CPA_BROKER_ENGINE_IMAGE:-remote-claude-browser-cpa:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.cpa
      target: cpa
    command: [node, -e, "process.exit(0)"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  cpa-broker:
    image: ${CPA_BROKER_IMAGE:-remote-claude-browser-cpa-broker:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.cpa-broker
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    environment:
      CPA_BROKER_SOCKET: /run/cpa/cpa.sock
      CPA_BROKER_NETWORK: ${CPA_RUNTIME_NETWORK:-remote-browser-cpa-runtime}
      CPA_BROKER_IMAGE: ${CPA_BROKER_ENGINE_IMAGE:-remote-claude-browser-cpa:local}
      # Each CPA instance gets its own internal network (a /28 from this range) shared only with
      # the broker, which relays its runtime-egress:8781 to the server's authenticated proxy.
      CPA_INSTANCE_SUBNETS: ${CPA_INSTANCE_SUBNETS:-10.254.0.0/16}
      CPA_BROKER_EGRESS: server:8781
    volumes:
      # The broker is the only container with Docker access. It is root-equivalent on the host:
      # creating containers is what it is for, and a URL-filtering socket proxy cannot tell its
      # fixed CPA template from any other container. Its own API is a Unix socket only the
      # gateway's group can open, and it accepts no Docker parameters. See docs/security.md.
      - /var/run/docker.sock:/var/run/docker.sock
      - cpa-control:/run/cpa
    networks: [cpa-runtime]
    depends_on:
      cpa-engine-image:
        condition: service_completed_successfully
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      # Healthy only while its socket exists and the Docker daemon answers.
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('node:fs');if(!fs.statSync('/run/cpa/cpa.sock').isSocket())process.exit(1);require('node:http').get({socketPath:'/var/run/docker.sock',path:'/_ping',timeout:2000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).on('timeout',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

networks:
  # The server and the broker. CPA instances are not on it: each has its own internal network.
  cpa-runtime:
    name: ${CPA_RUNTIME_NETWORK:-remote-browser-cpa-runtime}
    internal: true

volumes:
  cpa-control:
