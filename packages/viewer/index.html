<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/src/icon.svg" />
    <!-- Behind the sign-in, so the manifest is fetched with its cookie. A home-screen web app is
         what lets iPhone and iPad show website notifications (docs/usage.md 「网页通知」). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>远程 Claude</title>
    <script>
      // The first screen's requests start now, while the scripts download, and the API client
      // takes them over (src/boot-requests.ts). Only a page that shows the picker lists profiles:
      // the same choice as resumesClientSession and clientPageMode in src/client-session.ts.
      (function () {
        var query = new URLSearchParams(location.search);
        if (query.has("fixture") || query.get("closed") === "1") return;
        var picking = query.get("new") === "1";
        if (!picking && !query.get("sid")) {
          try {
            var key = sessionStorage.getItem("mirror.client-session.key") || "";
            picking = !/^[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/i.test(key);
          } catch (error) {
            picking = true;
          }
        }
        var requests = {};
        var get = function (path) {
          requests[path] = fetch(path, { credentials: "same-origin", cache: "no-store" });
          requests[path].catch(function () {});
        };
        get("/api/me");
        if (picking) get("/api/accounts");
        window.__mirrorBootRequests = requests;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
