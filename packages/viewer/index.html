<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/src/icon.svg" />
    <!-- Behind the sign-in, so the manifest is fetched with its cookie. A home-screen web app is
         what lets iPhone and iPad show website notifications (docs/usage.md 「网页通知」). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>远程 Claude</title>
    <script>
      // The first screen's requests start now, while the scripts download, and the API client
      // takes them over (src/boot-requests.ts). Only a page that shows the picker lists profiles,
      // and a tab coming back to its session asks for it again at once: the same choices as
      // resumesClientSession, prepareClientSession and clientPageMode in src/client-session.ts.
      (function () {
        var query = new URLSearchParams(location.search);
        if (query.has("fixture") || query.get("closed") === "1") return;
        var fresh = query.get("new") === "1";
        var sid = query.get("sid");
        var key = "";
        try {
          key = sessionStorage.getItem("mirror.client-session.key") || "";
        } catch (error) {}
        var hasKey = /^[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/i.test(key);
        var picking = fresh || (!sid && !hasKey);
        var requests = {};
        var send = function (method, path, body) {
          var name = method + " " + path + (body ? " " + body : "");
          var init = { credentials: "same-origin", cache: "no-store" };
          if (body) {
            init.method = method;
            init.headers = { "content-type": "application/json" };
            init.body = body;
          }
          requests[name] = fetch(path, init);
          requests[name].catch(function () {});
        };
        send("GET", "/api/me");
        if (picking) send("GET", "/api/accounts");
        else if (hasKey)
          send(
            "POST",
            "/api/client/session",
            JSON.stringify(sid ? { clientKey: key, sid: sid } : { clientKey: key }),
          );
        window.__mirrorBootRequests = requests;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
