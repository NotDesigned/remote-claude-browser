<!doctype html>
<!--
  A long chat conversation in the shape of claude.ai's, with made-up content, for the live tree's
  acceptance run and bench (packages/gateway/src/hub/live-tree.accept.ts,
  scripts/live-tree-bench.mts). Built by script so this file stays small:

  - 300 turns: paragraphs, code blocks with highlighted tokens, tables and math-like spans;
  - window.__fixture.stream(n, ms) streams n tokens into a new reply, one every `ms` (default 33);
  - a ProseMirror composer (/prosemirror-composer.js, the composer smoke's bundle);
  - window.__fixture.cssStorm(n): CSS-in-JS style insertRule calls into one style element;
  - adoptedStyleSheets on the document and in an open shadow root, and a closed shadow root;
  - a same-site and a cross-site frame (?cross=<origin> names the other site's origin).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Long conversation fixture</title>
    <style>
      body {
        margin: 0;
        font: 15px/1.5 system-ui, sans-serif;
        background: #faf9f5;
        color: #1f1e1d;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 16px 160px;
      }
      .turn {
        margin: 18px 0;
      }
      .turn.user {
        background: #efece3;
        border-radius: 12px;
        padding: 8px 14px;
      }
      pre {
        background: #262624;
        color: #f5f4ef;
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .tok-k {
        color: #d97757;
      }
      .tok-s {
        color: #9bc28b;
      }
      .tok-n {
        color: #c7a5ff;
      }
      table {
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px solid #ccc;
        padding: 2px 6px;
      }
      .katex {
        font-family: serif;
        font-style: italic;
      }
      #bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 8px;
        background: #fff;
        border-top: 1px solid #ddd;
      }
      .ProseMirror {
        min-height: 40px;
        border: 1px solid #888;
        padding: 6px;
        white-space: pre-wrap;
      }
      .ProseMirror p {
        margin: 0;
      }
      iframe {
        width: 320px;
        height: 120px;
        border: 1px solid #aaa;
      }
    </style>
    <style id="css-in-js"></style>
  </head>
  <body>
    <main id="thread"></main>
    <section id="extras">
      <div id="open-host"></div>
      <div id="closed-host"></div>
      <iframe id="same-site" src="/conversation-frame.html?site=same"></iframe>
      <iframe id="cross-site"></iframe>
    </section>
    <div id="bar"></div>
    <script src="/prosemirror-composer.js"></script>
    <script>
      (() => {
        // A small deterministic generator: the same page on every load.
        let seed = 7;
        const random = () => {
          seed = (seed * 1103515245 + 12345) % 2147483648;
          return seed / 2147483648;
        };
        const words = (
          "the model reads a file then writes a patch and runs the tests again while the " +
          "gateway keeps each tab current so a viewer that joins late sees the same page"
        ).split(" ");
        const sentence = (n) =>
          Array.from({ length: n }, () => words[Math.floor(random() * words.length)]).join(" ");
        const thread = document.getElementById("thread");
        const code = () => {
          const pre = document.createElement("pre");
          const element = document.createElement("code");
          for (let line = 0; line < 6; line++) {
            for (const [cls, text] of [
              ["tok-k", "const "],
              ["", "value" + line],
              ["", " = "],
              [line % 2 ? "tok-s" : "tok-n", line % 2 ? '"text"' : String(line * 7)],
              ["", ";\n"],
            ]) {
              const span = document.createElement("span");
              if (cls) span.className = cls;
              span.textContent = text;
              element.append(span);
            }
          }
          pre.append(element);
          return pre;
        };
        const table = () => {
          const t = document.createElement("table");
          for (let r = 0; r < 4; r++) {
            const row = t.insertRow();
            for (let c = 0; c < 3; c++) row.insertCell().textContent = sentence(2);
          }
          return t;
        };
        const math = () => {
          const span = document.createElement("span");
          span.className = "katex";
          span.innerHTML =
            '<span class="mord">x</span><span class="msupsub"><span class="mord">2</span></span>' +
            '<span class="mrel">=</span><span class="mord">y</span>';
          return span;
        };
        const turn = (role) => {
          const div = document.createElement("div");
          div.className = "turn " + role;
          div.dataset.testid = role === "user" ? "user-message" : "assistant-message";
          thread.append(div);
          return div;
        };
        for (let index = 0; index < 300; index++) {
          const user = turn("user");
          user.append(Object.assign(document.createElement("p"), { textContent: sentence(12) }));
          const reply = turn("assistant");
          for (let p = 0; p < 3; p++) {
            const para = document.createElement("p");
            para.append(sentence(20) + " ");
            if (p === 1) para.append(math());
            reply.append(para);
          }
          if (index % 3 === 0) reply.append(code());
          if (index % 5 === 0) reply.append(table());
        }

        // Adopted sheets, and shadow roots open and closed.
        const docSheet = new CSSStyleSheet();
        docSheet.replaceSync(".turn.assistant { border-left: 3px solid transparent; }");
        document.adoptedStyleSheets = [docSheet];
        const open = document.getElementById("open-host").attachShadow({ mode: "open" });
        const shadowSheet = new CSSStyleSheet();
        shadowSheet.replaceSync("p { color: #555; }");
        open.adoptedStyleSheets = [shadowSheet];
        open.innerHTML = "<p>open shadow <b>content</b></p><slot></slot>";
        const closed = document.getElementById("closed-host").attachShadow({ mode: "closed" });
        closed.innerHTML = "<p>closed shadow content</p>";

        const params = new URLSearchParams(location.search);
        const cross = params.get("cross");
        if (cross) document.getElementById("cross-site").src = cross + "/conversation-frame.html?site=cross";

        const cssInJs = document.getElementById("css-in-js").sheet;
        let cssCount = 0;
        window.__fixture = {
          /** Streams n tokens into a new reply, one every `ms`; resolves when done. */
          stream(n, ms = 33) {
            const reply = turn("assistant");
            reply.dataset.streaming = "true";
            let para = document.createElement("p");
            reply.append(para);
            let count = 0;
            return new Promise((resolve) => {
              const tick = () => {
                if (count >= n) {
                  delete reply.dataset.streaming;
                  resolve(count);
                  return;
                }
                count += 1;
                if (count % 60 === 0) {
                  para = document.createElement("p");
                  reply.append(para);
                }
                if (count % 150 === 0) reply.append(code());
                para.append(words[count % words.length] + " ");
                setTimeout(tick, ms);
              };
              tick();
            });
          },
          /** CSS-in-JS: n rules inserted one at a time, as emotion and styled-components do. */
          cssStorm(n) {
            for (let index = 0; index < n; index++) {
              cssCount += 1;
              cssInJs.insertRule(
                `.css-${cssCount} { margin-top: ${cssCount % 9}px; color: rgb(${cssCount % 255}, 0, 0); }`,
                cssInJs.cssRules.length,
              );
            }
            return cssInJs.cssRules.length;
          },
          /** Turns the newest messages into the shape a sent message takes. */
          send(text) {
            turn("user").append(Object.assign(document.createElement("p"), { textContent: text }));
          },
        };
        if (window.PMComposer) {
          window.composerView = PMComposer.mount(document.getElementById("bar"), {
            onSend: (text) => window.__fixture.send(text),
          });
        }
        document.body.dataset.ready = "yes";
      })();
    </script>
  </body>
</html>
