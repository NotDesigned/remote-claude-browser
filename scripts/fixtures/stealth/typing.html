<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="/detector.js" data-fx></script>
    <title>Stealth typing</title>
    <style data-fx>
      body {
        font: 16px sans-serif;
        margin: 8px;
      }
      #ce,
      .ProseMirror {
        min-height: 32px;
        border: 1px solid #888;
        padding: 4px;
        margin: 4px 0;
      }
      .ProseMirror p {
        margin: 0;
      }
      #scroller {
        height: 160px;
        overflow: auto;
        border: 1px solid #888;
      }
      #scroller p {
        margin: 0;
        height: 40px;
      }
      #code {
        margin: 0;
        height: 80px;
        overflow: auto;
        background: #eee;
      }
    </style>
  </head>
  <body>
    <input id="inp" />
    <textarea id="ta"></textarea>
    <div id="ce" contenteditable="true"></div>
    <div id="pm"></div>
    <div id="scroller"></div>
    <script src="/prosemirror-composer.js" data-fx></script>
    <script data-fx>
      PMComposer.mount(document.getElementById("pm"), { onSend: () => {} });
      // A transcript that follows its end until a person scrolls up, as chat apps do: only a wheel
      // tells it a person did.
      const scroller = document.getElementById("scroller");
      const state = { stuck: true };
      // Near its end, a code block that scrolls on its own sits where the transcript's centre is: a
      // wheel aimed there would scroll the code block instead.
      const code = document.createElement("pre");
      code.id = "code";
      code.textContent = Array.from({ length: 40 }, (_, i) => "code " + i).join("\n");
      const tail = document.createElement("p");
      tail.textContent = "last line";
      scroller.append(code, tail);
      let lines = 0;
      const addLines = (count) => {
        for (let i = 0; i < count; i++) {
          const line = document.createElement("p");
          line.textContent = "line " + lines++;
          scroller.insertBefore(line, code);
        }
      };
      addLines(60);
      code.scrollTop = code.scrollHeight;
      scroller.scrollTop = scroller.scrollHeight;
      scroller.addEventListener("wheel", (event) => {
        if (event.deltaY < 0) state.stuck = false;
      });
      scroller.addEventListener("scroll", () => {
        if (state.stuck) scroller.scrollTop = scroller.scrollHeight;
      });
      // New output arrives and the transcript follows it, without a scroll the viewer sent.
      __fx.grow = () => {
        addLines(20);
        if (state.stuck) scroller.scrollTop = scroller.scrollHeight;
        return scroller.scrollTop;
      };
      __fx.scroll = () => ({
        stuck: state.stuck,
        top: scroller.scrollTop,
        bottom: scroller.scrollHeight - scroller.clientHeight,
        code: code.scrollTop,
      });
    </script>
  </body>
</html>
